<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a24"><meta name="description" content="Björnrike Afterski – friendslop-partyspel för skidresan.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Björnrike Afterski</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column; lift-ticket cards under a neon afterski night that gets drunker as you do */
:root{
  --night:#101a24; --night-2:#18263a; --line:#2c3d52; --snow:#eef3f7; --muted:#97a8b8;
  --falu:#d2412d; --ticket:#f2c33b; --ticket-ink:#221c0e; --pist:#3f7fe3; --pine:#2f6b52; --good:#58c487; --neon:#ff3fa4;
  --f-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--night);color:var(--snow);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden;
  background-image:radial-gradient(120% 60% at 50% 115%,#1e3a4f 0%,transparent 60%),radial-gradient(60% 40% at 85% -5%,#3a1f4f 0%,transparent 70%)}
#snow,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#snow{z-index:0}#fx{z-index:60}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px}
#app.hic{animation:hic .35s ease-out}
#app.shake{animation:shake .45s linear}
@keyframes hic{0%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-1.5deg)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px) rotate(-1deg)}40%{transform:translate(7px,-5px) rotate(1deg)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:19px;line-height:1}
.brand small{display:block;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--neon);text-transform:uppercase;margin-top:4px}
.top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.chip{font-family:var(--f-label);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;background:var(--ticket);color:var(--ticket-ink);padding:6px 10px;border-radius:6px;white-space:nowrap}
.chip.dark{background:var(--night-2);color:var(--snow);border:1px solid var(--line)}
.chip.hot{background:var(--neon);color:#1a0612}
.linkbtn{appearance:none;background:none;border:0;color:var(--muted);font:700 13px var(--f-label);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;padding:6px}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
.ticket{background:var(--ticket);color:var(--ticket-ink);border-radius:12px;padding:18px 22px;position:relative;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.ticket.hot{background:var(--neon);color:#1a0612}
.ticket .perf{border-top:2px dashed rgba(34,28,14,.35);margin:14px -22px 12px}
.ticket .label{color:rgba(34,28,14,.72)}
.panel{background:var(--night-2);border:1px solid var(--line);border-radius:12px;padding:16px}
.display{font-family:var(--f-display);font-size:clamp(40px,13vw,66px);line-height:.92;margin:0;text-wrap:balance}
.tilt{transform:rotate(-2.5deg);transform-origin:left center}
.h2{font-family:var(--f-display);font-size:clamp(26px,8vw,36px);line-height:1;margin:0;text-wrap:balance}
.label{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.lede{margin:0;color:var(--muted);max-width:60ch}
.ticket .lede{color:rgba(34,28,14,.8)}
.roast{font-family:var(--f-display);font-size:clamp(20px,6vw,26px);line-height:1.1;margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:10px;min-height:54px;padding:0 18px;font-family:var(--f-display);font-size:18px;cursor:pointer;background:var(--falu);color:var(--snow);width:100%;touch-action:manipulation}
.btn.alt{background:var(--ticket);color:var(--ticket-ink)}
.btn.hot{background:var(--neon);color:#1a0612}
.btn.ghost{background:transparent;color:var(--snow);border:2px solid var(--line)}
.btn.small{min-height:44px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px) scale(.99)}
button:focus-visible,input:focus-visible{outline:3px solid var(--pist);outline-offset:2px}
.field{width:100%;min-height:52px;border-radius:10px;border:2px solid var(--line);background:var(--night);color:var(--snow);font:600 18px var(--f-body);padding:0 14px}
.field.code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--f-display);font-weight:400;text-align:center}
.note{font-size:14px;color:var(--muted);margin:0}
.note.warn{color:var(--ticket)}
.diff{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:6px}
.diff.green{background:var(--good);border-radius:50%}
.diff.blue{background:var(--pist)}
.diff.red{background:var(--falu)}
.diff.black{background:#0c0f12;transform:rotate(45deg) scale(.82);outline:2px solid currentColor}
.players{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.pl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-variant-numeric:tabular-nums}
.nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.you{font:700 11px var(--f-label);letter-spacing:.12em;color:var(--ticket);margin-left:6px;text-transform:uppercase}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.meter{display:flex;align-items:center;gap:8px;font:700 14px var(--f-label);letter-spacing:.05em;white-space:nowrap}
.meter .bar{width:48px;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ticket),var(--falu),var(--neon))}
.pts{font-family:var(--f-display);font-size:18px}
.timeline{display:flex;gap:4px}
.timeline span{flex:1;height:6px;border-radius:3px;background:rgba(34,28,14,.18)}
.timeline span.on{background:currentColor}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.wait{display:flex;flex-wrap:wrap;gap:6px}
.wait span{font:700 13px var(--f-label);letter-spacing:.08em;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.wait span.done{background:var(--pine);border-color:var(--pine);color:var(--snow)}
.wait span.dead{background:var(--falu);border-color:var(--falu);color:var(--snow)}
.modbadge{font:700 12px var(--f-label);letter-spacing:.12em;text-transform:uppercase;background:var(--neon);color:#1a0612;padding:4px 8px;border-radius:5px;align-self:flex-start}
/* stage + chaos modifiers */
.mod-flip{transform:rotate(180deg)}
.mod-mirror{transform:scaleX(-1)}
.mod-blur{filter:blur(2.6px)}
.mod-dark{animation:blackout 2.6s steps(1,end) infinite}
@keyframes blackout{0%{filter:none}38%{filter:brightness(.04)}46%{filter:none}63%{filter:brightness(.04)}67%{filter:none}88%{filter:brightness(.04)}}
.mod-quake{animation:quake .22s linear infinite}
@keyframes quake{0%,100%{transform:none}25%{transform:translate(-5px,3px) rotate(-.8deg)}50%{transform:translate(4px,-4px) rotate(.6deg)}75%{transform:translate(-3px,-2px)}}
.drunk{animation:drunk 3.4s ease-in-out infinite}
@keyframes drunk{0%,100%{transform:rotate(calc(var(--sw) * -1deg)) skewX(calc(var(--sw) * .6deg))}50%{transform:rotate(calc(var(--sw) * 1deg)) skewX(calc(var(--sw) * -.6deg))}}
@media (prefers-reduced-motion: reduce){.drunk{animation:none}#app.hic,#app.shake{animation:none}}
.game{display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;gap:10px;font:700 15px var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:0;color:var(--ticket)}
canvas.play{width:100%;display:block;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.pist-cv{height:min(50vh,470px)}
.hem-cv{height:min(46vh,420px)}
.dans-cv{height:min(44vh,400px);background:#170f26}
.steer{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steer button,.lanes button{appearance:none;border-radius:12px;min-height:64px;font:400 28px var(--f-display);background:var(--night-2);color:var(--snow);border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.steer button.on,.lanes button.on{background:var(--pist);border-color:var(--pist)}
.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.flash{min-height:28px;text-align:center;font:400 21px var(--f-display);color:var(--ticket)}
.flash.bad{color:var(--falu)}
.flash.good{color:var(--good)}
.flash.hot{color:var(--neon)}
/* tunnan */
.keg{position:relative;height:min(36vh,300px);width:min(60%,220px);align-self:center;border:6px solid #8a5a33;border-radius:26px 26px 34px 34px;background:#2a1c12;overflow:hidden}
.keg i{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(#ffd96a,#e7a51e);transition:height .08s}
.keg i::before{content:"";position:absolute;left:0;right:0;top:-10px;height:16px;background:#fffbe9;border-radius:8px}
.keg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 46px,rgba(138,90,51,.9) 46px 54px)}
.mash{appearance:none;border:0;border-radius:16px;min-height:110px;font:400 34px var(--f-display);background:var(--good);color:#082014;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mash.stop{background:var(--falu);color:var(--snow)}
/* bastun */
.bastu{position:relative;border-radius:16px;overflow:hidden;background:#3b2414;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:min(46vh,380px);justify-content:center}
.bastu .heat{position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,#ff5a1f,#b3170b 60%,#3b0a05);opacity:0;pointer-events:none}
.bastu .temp{position:relative;font:400 clamp(60px,22vw,110px) var(--f-display);line-height:1;font-variant-numeric:tabular-nums}
.bastu .sub{position:relative;font:700 16px var(--f-label);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.hold{appearance:none;border:0;border-radius:16px;min-height:110px;font:400 30px var(--f-display);background:var(--ticket);color:var(--ticket-ink);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.hold.on{background:var(--falu);color:var(--snow)}
/* shots / vote / cards */
.vote-q{font-family:var(--f-display);font-size:clamp(24px,7vw,32px);line-height:1.08;margin:0;text-wrap:balance}
.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vote-btn{appearance:none;border:2px solid var(--line);background:var(--night-2);color:var(--snow);border-radius:12px;min-height:64px;padding:10px;font:700 18px var(--f-body);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-width:0}
.vote-btn span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cards{display:flex;gap:14px;justify-content:center;align-items:center}
.card{width:min(34vw,130px);aspect-ratio:5/7;max-width:100%;border-radius:12px;background:var(--snow);color:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-size:clamp(34px,11vw,48px);line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card .s{font-size:.8em}
.card.red{color:var(--falu)}
.card.back{background:repeating-linear-gradient(45deg,var(--falu) 0 8px,#9c3122 8px 16px);border:6px solid var(--snow)}
.bets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bets button{appearance:none;min-height:46px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--snow);font:700 16px var(--f-label);letter-spacing:.08em;cursor:pointer}
.bets button.sel{background:var(--ticket);color:var(--ticket-ink);border-color:var(--ticket)}
.bets button.allin.sel{background:var(--neon);border-color:var(--neon);color:#1a0612}
.res-row{display:grid;grid-template-columns:28px auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-variant-numeric:tabular-nums}
.res-row .place{font-family:var(--f-display);font-size:18px;color:var(--muted)}
.res-row .val{color:var(--muted);font-weight:600;white-space:nowrap}
.tag{font:700 11px var(--f-label);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--falu);color:var(--snow);white-space:nowrap}
.titles{display:grid;grid-template-columns:1fr;gap:10px}
.title-card{border-radius:12px;padding:14px 16px;background:var(--night-2);border:1px solid var(--line)}
.title-card .who{font-family:var(--f-display);font-size:22px;line-height:1.1;margin-top:4px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
/* snowballs */
.sb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px dashed var(--line)}
.sb .label{color:var(--snow)}
.sb button{appearance:none;border:2px solid var(--line);background:var(--night);color:var(--snow);border-radius:999px;padding:7px 12px;font:700 14px var(--f-label);letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:100%;min-width:0}
.sb button:disabled{opacity:.35;cursor:not-allowed}
#splat{position:fixed;inset:0;pointer-events:none;z-index:55}
#splat .blob{position:absolute;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff 0%,#f4f8fb 45%,rgba(230,240,248,.92) 62%,rgba(230,240,248,0) 72%);transition:opacity 1.6s ease-in,transform 2.2s ease-in}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:var(--neon);color:#1a0612;font:400 17px var(--f-display);padding:8px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* wheel */
.wheel-wrap{position:relative;align-self:center;width:min(86vw,340px);max-width:100%;aspect-ratio:1}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-wrap .ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--neon);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.hero-ticket .display{font-size:clamp(46px,15vw,74px)}
.stamp{position:absolute;right:14px;top:12px;font:700 11px var(--f-label);letter-spacing:.14em;text-transform:uppercase;border:2px solid currentColor;padding:3px 7px;border-radius:4px;transform:rotate(7deg);opacity:.8}

@media (prefers-reduced-motion: reduce){.mod-quake,.mod-dark{animation:none}}
/* ankarliften */
.ltrack{position:relative;height:84px;border-radius:12px;background:var(--night-2);border:2px solid var(--line);overflow:hidden}
.ltrack .lz{position:absolute;top:0;bottom:0;background:rgba(88,196,135,.42)}
.ltrack .lb{position:absolute;top:0;bottom:0;width:3%;background:var(--good)}
.ltrack .lm{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:var(--ticket);box-shadow:0 0 14px var(--ticket)}
/* grillkön */
.grill-show{min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:12px;background:#2a1a10;color:var(--ticket);font:400 clamp(24px,8vw,38px) var(--f-display);padding:12px;line-height:1.1}
.grill-show.small{font:700 16px var(--f-body);color:var(--snow)}
.grill-show.pulse{animation:pop .25s ease-out}
.grill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grill-grid button{appearance:none;min-height:58px;border-radius:10px;border:2px solid #8a5a33;background:#3b2414;color:var(--snow);font:700 16px var(--f-body);cursor:pointer;touch-action:manipulation;min-width:0}
.grill-grid button:disabled{opacity:.45}
/* pjäxorna */
.pbar{height:18px;border-radius:9px;background:var(--night-2);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--ticket);transition:width .06s}
.steer.big button{min-height:130px;font-size:22px}
/* snöbollskriget */
.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{appearance:none;border:0;padding:0;aspect-ratio:1;max-width:100%;border-radius:14px;background:linear-gradient(#22344c,#18263a);position:relative;overflow:hidden;cursor:pointer;touch-action:manipulation}
.hole::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:#f4f8fb;border-top:4px solid #cfdbe6;border-radius:40% 40% 0 0/30% 30% 0 0;z-index:1}
.hole .head{position:absolute;left:14%;right:14%;top:12%;bottom:22%;border-radius:50% 50% 42% 42%;display:flex;align-items:flex-start;justify-content:center;padding-top:16%;font:400 clamp(10px,3.2vw,15px) var(--f-display);color:#101a24;text-align:center;overflow:hidden;line-height:1.05;animation:popup .14s ease-out;z-index:0}
.hole .head.bad{background:#7c2b8f!important;color:var(--snow)}
.hole .head.hit{filter:grayscale(1) brightness(1.6);transform:rotate(18deg)}
@keyframes popup{from{transform:translateY(70%)}to{transform:none}}
/* ölpong */
.pong-table{position:relative;height:150px;border-radius:12px;background:#1f5b3f;border:4px solid #e9f0f6;overflow:hidden}
.pong-table::before{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid rgba(255,255,255,.5)}
.cup{position:absolute;top:28%;width:11%;aspect-ratio:1;margin-left:-5.5%;border-radius:50%;background:radial-gradient(circle,#e7a51e 0 45%,#d2412d 46%);border:4px solid #fff;transition:opacity .3s,transform .3s}
.cup.gone{opacity:.1;transform:scale(.6)}
.aim{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--ticket);box-shadow:0 0 10px var(--ticket)}
.pwr{position:relative;height:34px;border-radius:8px;background:var(--night-2);border:2px solid var(--line);overflow:hidden}
.pwr .sweet{position:absolute;left:60%;width:20%;top:0;bottom:0;background:rgba(242,195,59,.5)}
.pwr .pm{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--snow)}
/* mössan */
.hats{position:relative;height:min(40vw,180px);border-radius:12px;background:var(--night-2);border:1px solid var(--line)}
.hat{appearance:none;border:0;background:transparent;padding:0;position:absolute;bottom:10px;width:22%;height:78%;cursor:pointer;transition-property:left;transition-timing-function:ease-in-out}
.hat .under{position:absolute;left:18%;right:18%;bottom:3%;height:24%;border-radius:4px;background:var(--ticket);z-index:0;opacity:0}
.hat.has .under{opacity:1}
.hat::before{content:"";position:absolute;left:0;right:0;bottom:0;height:72%;border-radius:50% 50% 10px 10px;background:repeating-linear-gradient(0deg,#d2412d 0 10px,#f4f8fb 10px 20px);transition:transform .3s;z-index:1}

/* ================= HELPERS ================= */
function el(tag,props,kids){const e=document.createElement(tag);
 for(const [k,v] of Object.entries(props||{})){
  if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='style')e.style.cssText=v;
  else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
  else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
 for(const c of [].concat(kids==null?[]:kids)){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)));}
 return e;}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const permil=x=>(x||0).toFixed(1).replace('.',',')+' ‰';
const r2=x=>Math.round(x*100)/100;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function fit(cv,cap){const r=cv.getBoundingClientRect();const dpr=Math.min(cap||2,window.devicePixelRatio||1);
 const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
 if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
 const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,W:r.width,H:r.height}}
function colorOf(id){const st=S.state;const ids=(st&&st.ids)||rosterIds();const i=Math.max(0,ids.indexOf(id));return COLORS[i%COLORS.length]}
function dot(id){return el('span',{class:'dot',style:'background:'+colorOf(id)})}
function nameOf(id){const st=S.state;return (st&&st.nm&&st.nm[id])||(roster().find(p=>p.id===id)||{}).n||'Någon'}
const fill=(s,n)=>s.replace(/\{n\}/g,n);
function hud(...pairs){return el('div',{class:'hud'},pairs.map(([l,b])=>el('span',{},[l+' ',b])))}
function keys(down,up){const d=e=>down(e),u=e=>up&&up(e);window.addEventListener('keydown',d);window.addEventListener('keyup',u);return()=>{window.removeEventListener('keydown',d);window.removeEventListener('keyup',u)}}
function shakeApp(cls){const a=document.getElementById('app');a.classList.remove('hic','shake');void a.offsetWidth;a.classList.add(cls||'shake');setTimeout(()=>a.classList.remove(cls||'shake'),500)}
function toast(t){const box=document.getElementById('toast');const d=el('div',{text:t});box.append(d);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>d.remove(),2600)}

const SFX={ac:null,_bus:null,vol:0.5,

 _last:{},gate(k,ms){const n=performance.now();if(this._last[k]&&n-this._last[k]<ms)return false;this._last[k]=n;return true},

 blip(fr,dur,vol,type,to){const ac=this.ac;if(!ac)return;const t=ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(SFX.bus());o.start(t);o.stop(t+dur+0.02)},
 noise(dur,freq,type,vol){const ac=this.ac;if(!ac)return;const len=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(SFX.bus());s.start()},

 if(!fxRaf){let last=performance.now();const f=n2=>{const dt=Math.min(0.05,(n2-last)/1000);last=n2;const {ctx,W,H}=fit(cv,1);ctx.clearRect(0,0,W,H);
  fxParts=fxParts.filter(p=>(p.life-=dt)>0&&p.y<H+20);for(const p of fxParts){p.vy+=24*dt;p.x+=p.vx*dt*30;p.y+=p.vy*dt*30;p.r+=p.vr;const cs=Math.cos(p.r),sn=Math.sin(p.r);ctx.setTransform(cs,sn,-sn,cs,p.x,p.y);ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.c;ctx.fillRect(-5,-3,10,6)}ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;

/* ================= ONLINE OUTSIDE CLAUDE (PeerJS) ================= */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const PeerApi={kind:'peer',async join(name,opts){if(!window.Peer)await loadScript('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js');return makePeerRoom(name,!!(opts&&opts.host))}};
function makePeerRoom(name,isHost){
 const hostId='bjornrike-afterski-'+name;
 let me=null,handlers=[],pres={},conns=[],hostConn=null,myP={},peersArr=[],done=false;
 const emit=()=>{peersArr=Object.entries(pres).map(([id,p])=>({peer:id,presence:p||{},sameTab:id===me,isMe:id===me,kind:'viewer',by:null,guest:false,updatedAt:Date.now()}));const ch={peers:peersArr,joined:[],left:[],updated:[]};handlers.forEach(h=>{try{h(ch)}catch(e){console.error(e)}})};
 const broadcast=()=>{const m={t:'all',m:pres};conns.forEach(c=>{if(c.open){try{c.send(m)}catch(e){}}})};
 return new Promise((resolve,reject)=>{
  const peer=isHost?new Peer(hostId):new Peer();
  const api={
   presence(patch){Object.entries(patch).forEach(([k,v])=>{if(v===null)delete myP[k];else myP[k]=v});pres[me]=JSON.parse(JSON.stringify(myP));
    if(isHost){emit();broadcast()}else{if(hostConn&&hostConn.open){try{hostConn.send({t:'p',p:myP})}catch(e){}}emit()}return Promise.resolve()},
   onPeers(fn){handlers.push(fn);setTimeout(emit,0);return()=>{handlers=handlers.filter(h=>h!==fn)}},
   peers(){return peersArr},
   leave(){try{peer.destroy()}catch(e){}return Promise.resolve()}
  };
  peer.on('error',e=>{if(!done){done=true;reject(e)}else if(!isHost&&e&&e.type==='network')toast('Tappade kontakten med värden')});
  peer.on('open',id=>{me=id;pres[me]={};
   if(isHost){
    peer.on('connection',c=>{conns.push(c);
     c.on('open',()=>{try{c.send({t:'all',m:pres})}catch(e){}});
     c.on('data',d=>{if(d&&d.t==='p'&&d.p&&typeof d.p==='object'){pres[c.peer]=d.p;emit();broadcast()}});
     c.on('close',()=>{conns=conns.filter(x=>x!==c);delete pres[c.peer];emit();broadcast()})});
    done=true;resolve(api)}
   else{
    hostConn=peer.connect(hostId,{reliable:true});
    const to=setTimeout(()=>{if(!done){done=true;reject(new Error('timeout'))}},10000);
    hostConn.on('open',()=>{clearTimeout(to);if(!done){done=true;resolve(api)}try{hostConn.send({t:'p',p:myP})}catch(e){}});
    hostConn.on('data',d=>{if(d&&d.t==='all'&&d.m){pres=d.m;if(!pres[me])pres[me]=myP;emit()}});
    hostConn.on('close',()=>{pres={};pres[me]=myP;emit();toast('Värden stängde rummet')})}
  });
 });
}

function rankPts(vals,higher){

function finishGame(){

  const q=st.ex.q.map(p=>({p,top:[],c:{}}));
  q.forEach((o,k)=>{st.ids.forEach(id=>{const v=inp[id]&&Array.isArray(inp[id].v)?inp[id].v[k]:null;if(v&&st.ids.includes(v))o.c[v]=(o.c[v]||0)+1});
   const max=Math.max(0,...Object.values(o.c));o.top=max?Object.keys(o.c).filter(id=>o.c[id]===max):[]});
  const pts={};st.ids.forEach(id=>pts[id]=0);
  q.forEach((o,k)=>{st.ids.forEach(id=>{const v=inp[id]&&inp[id].v?inp[id].v[k]:null;if(v&&o.top.includes(v))pts[id]+=mult});o.top.forEach(id=>{st.pr[id]=r2(st.pr[id]+0.3)})});

  if(G.key==='kasino')st.ids.forEach(id=>{if(vals[id]===0&&!rp.losers.includes(id))st.pr[id]=r2(st.pr[id]+0.35)});

function spinWheel(){

 const rand=st.ids[Math.floor(Math.random()*st.ids.length)];const N=id=>st.nm[id]||'Någon';let d='';
 switch(WHEEL[i].t){
  case 'SKÅL!':st.ids.forEach(id=>st.pr[id]=r2(st.pr[id]+0.3));d='Alla tar en. +0,3 ‰ på hela gänget.';break;

  case 'DUBBELT':st.dbl=true;d='Nästa spel ger dubbla poäng.';break;
  case 'LIFTKORTET':st.sc[lead]=Math.max(0,st.sc[lead]-3);d=N(lead)+' tappade liftkortet. −3 poäng.';break;

  case 'JORDBÄVNING':st.mod='quake';d='En pistmaskin kör in i stugan. Nästa spel skakar allt.';break;

   if(Math.abs(diff)<14){lockT+=dt;if(lockT>0.9){SFX.horn();fl.textContent=NAMES[k]+' hittad!';fl.className='flash good';k++;if(k>=N){ended=true;window.removeEventListener('deviceorientation',onOri);const ms=Math.round(t*1000);setTimeout(()=>done(ms),800)}else{kEl.textContent=(k+1)+'/'+N;newT()}}}else lockT=Math.max(0,lockT-dt*2);
   if(t>=60&&!ended){ended=true;setTimeout(()=>done(60000),300)}}
  c.fillStyle='#050912';c.fillRect(0,0,W,H);for(let i=0;i<50;i++){c.fillStyle='rgba(255,255,255,.4)';circ(c,(i*97.1+head*3)%W,(i*37.3)%(H*0.6),1);c.fill()}
  c.fillStyle='#dfe8f0';c.fillRect(0,H*0.8,W,H*0.2);
  const sx=W/2+diff/90*W*0.5;
  if(Math.abs(diff)<100){const gl=c.createRadialGradient(sx,H*0.62,4,sx,H*0.62,80+close*60);gl.addColorStop(0,'rgba(255,210,122,'+(0.15+close*0.6).toFixed(2)+')');gl.addColorStop(1,'rgba(255,210,122,0)');c.fillStyle=gl;circ(c,sx,H*0.62,140);c.fill();
   c.fillStyle='#3a1a14';c.fillRect(sx-40,H*0.62,80,H*0.18);c.fillStyle='#14100a';c.beginPath();c.moveTo(sx-50,H*0.62);c.lineTo(sx,H*0.48);c.lineTo(sx+50,H*0.62);c.fill();c.fillStyle='#ffd27a';c.fillRect(sx-12,H*0.66,22,16);
   c.fillStyle='#eef3f7';c.font='700 12px "Barlow Condensed",sans-serif';c.textAlign='center';c.fillText(NAMES[Math.min(k,N-1)].toUpperCase(),sx,H*0.46)}
  for(let i=0;i<9;i++){const x=((i*W/8-head*4)%(W+60)+W+60)%(W+60)-30;c.fillStyle='#0d1f17';c.beginPath();c.moveTo(x,H*0.8);c.lineTo(x+18,H*0.55);c.lineTo(x+36,H*0.8);c.fill()}
  const sc=Math.min(1.1,H/200);guy(c,{x:W/2,y:H*0.98,s:sc,col:ME,aR:2.3,aL:0.3,flip:diff<0?-1:1,eyes:close>0.85?'happy':'o',mouth:close>0.85?'grin':'frown',flush:-0.3,lean:Math.sin(tt*1.6)*pr*0.06,
   hold:(c2,hx,hy)=>{c2.fillStyle='#fff8c4';c2.globalAlpha=0.6;c2.beginPath();c2.moveTo(hx,hy);c2.lineTo(hx+60,hy-30);c2.lineTo(hx+60,hy+20);c2.fill();c2.globalAlpha=1}});
  c.fillStyle='rgba(255,255,255,.15)';c.fillRect(W*0.1,10,W*0.8,6);c.fillStyle=close>0.9?'#58c487':close>0.6?'#f2c33b':'#d2412d';c.fillRect(W*0.1,10,W*0.8*close,6);
  c.fillStyle='#eef3f7';c.font='700 11px "Barlow Condensed",sans-serif';c.textAlign='left';c.fillText(close>0.9?'VARMT!':close>0.6?'LJUMMET':'KALLT',W*0.1,30);
 });
 return()=>{ended=true;window.removeEventListener('deviceorientation',onOri);stop()};
};

/* --- Lutpisten (lutning) --- */
PLAY.lut=function(box,seed,pr,done){
 const R=rng(seed),gates=[];let gy0=1;for(let i=0;i<40;i++){gates.push({y:gy0,x:0.2+R()*0.6,w:Math.max(0.16,0.3-i*0.004),done:false,ok:false});gy0+=0.55}
 let manual=false,phase='ask',t=0,x=0.5,tilt=0,base=null,steer=0,d=0,score=0,ended=false,crashT=0;
 const ME=colorOf(myId());
 const cv=el('canvas',{class:'play pist-cv','aria-label':'Lutpisten'});
 const sEl=el('b',{text:'0'}),tEl=el('b',{text:'25'}),fl=el('div',{class:'flash',text:'Mobilen är dina skidor. Luta för att svänga.'});
 const go=el('button',{class:'btn alt',text:'Spänn på dig (tillåt rörelse)'});
 const bL=el('button',{text:'◀'}),bR=el('button',{text:'▶'});const st=el('div',{class:'steer',hidden:true},[bL,bR]);
 box.append(hud(['Portar',sEl],['Tid',tEl]),cv,fl,go,st);
 hold(bL,()=>{steer=-1},()=>{if(steer<0)steer=0});hold(bR,()=>{steer=1},()=>{if(steer>0)steer=0});
 const onOri=e=>{if(e.gamma==null)return;if(base==null)base=e.gamma;tilt=Math.max(-1,Math.min(1,(e.gamma-base)/25))};
 motionStart(box,go,()=>{phase='play';t=0;fl.textContent='Luta vänster och höger!';fl.className='flash hot'},()=>{manual=true;st.hidden=false;sensorNote(box,'Ingen lutningssensor. Styr med pilarna.');phase='play';t=0},'deviceorientation',onOri);
 const stop=sceneLoop(cv,(c,W,H,tt,dt)=>{crashT=Math.max(0,crashT-dt);
  if(phase==='play'&&!ended){t+=dt;if(manual)tilt+=(steer-tilt)*Math.min(1,dt*6);const v=0.5+t*0.018;d+=v*dt;x+=(tilt*1.3+pr*0.3*Math.sin(t*2))*dt;x=Math.max(0.04,Math.min(0.96,x));
   for(const g of gates){if(!g.done&&g.y<=d){g.done=true;g.ok=Math.abs(x-g.x)<=g.w/2;if(g.ok){score++;sEl.textContent=String(score);SFX.blip(800,0.06,0.1,'square')}else{crashT=0.4;SFX.fail()}}}
   tEl.textContent=String(Math.max(0,Math.ceil(25-t)));if(t>=25){ended=true;window.removeEventListener('deviceorientation',onOri);fl.textContent=score+' portar!';fl.className='flash good';SFX.horn();setTimeout(()=>done(score),700)}}
  const py=H*0.25,U=H*0.85;c.fillStyle='#eef3f7';c.fillRect(0,0,W,H);c.strokeStyle='rgba(90,120,150,.13)';const off=(d*U)%16;for(let yy=-off;yy<H;yy+=16){c.beginPath();c.moveTo(0,yy);c.lineTo(W,yy);c.stroke()}
  for(const g of gates){const sy=py+(g.y-d)*U;if(sy<-30||sy>H+30)continue;const col=gates.indexOf(g)%2?'#3f7fe3':'#d2412d';c.globalAlpha=g.done?0.3:1;[[g.x-g.w/2,-1],[g.x+g.w/2,1]].forEach(([gx,dir])=>{c.strokeStyle='#222';c.lineWidth=3;c.beginPath();c.moveTo(gx*W,sy-24);c.lineTo(gx*W,sy+2);c.stroke();c.fillStyle=col;c.beginPath();c.moveTo(gx*W,sy-24);c.lineTo(gx*W+dir*14,sy-18);c.lineTo(gx*W,sy-12);c.fill()});c.globalAlpha=1}
  const sc=Math.min(0.9,H/300);c.save();c.translate(x*W,py);c.rotate(tilt*0.4);c.strokeStyle='#d2412d';c.lineWidth=3;c.beginPath();c.moveTo(-8,-14);c.lineTo(-8,14);c.moveTo(8,-14);c.lineTo(8,14);c.stroke();c.restore();
  guy(c,{x:x*W,y:py+6,s:sc,col:ME,lean:tilt*0.4,aL:0.6,aR:-0.5,eyes:crashT>0?'x':'o',mouth:crashT>0?'o':'grin'});
  c.fillStyle='rgba(16,26,36,.6)';c.fillRect(W/2-40,H-14,80,6);c.fillStyle='#f2c33b';c.fillRect(W/2-2+tilt*38,H-16,4,10);
 });
 return()=>{ended=true;window.removeEventListener('deviceorientation',onOri);stop()};
};

/* --- Spring till liften (stegräknare) --- */
PLAY.steg=function(box,seed,pr,done){
 const GOAL=30;let manual=false,phase='ask',t=0,n=0,state=0,cool=0,ended=false,last=0,lastSide=-1;
 const ME=colorOf(myId());
 const cv=el('canvas',{class:'play scene-cv tall','aria-label':'Spring till liften'});
 const nEl=el('b',{text:'0/'+GOAL}),tEl=el('b',{text:'0,0 s'}),fl=el('div',{class:'flash',text:'Liften stänger! Spring på stället med mobilen i handen.'});
 const go=el('button',{class:'btn alt',text:'Redo (tillåt rörelse)'});
 const bL=el('button',{text:'VÄNSTER'}),bR=el('button',{text:'HÖGER'});const st=el('div',{class:'steer big',hidden:true},[bL,bR]);
 box.append(hud(['Steg',nEl],['Tid',tEl]),cv,fl,go,st);
 const step=()=>{if(phase!=='go')return;n++;last=t;nEl.textContent=n+'/'+GOAL;SFX.blip(n%2?300:360,0.04,0.08,'square');if(n>=GOAL){ended=true;phase='done';window.removeEventListener('devicemotion',onM);const ms=Math.round(t*1000);fl.textContent='Hann med liften! '+(t).toFixed(1).replace('.',',')+' s';fl.className='flash good';SFX.horn();setTimeout(()=>done(ms),900)}};
 const onM=e=>{const a=e.accelerationIncludingGravity;if(!a||phase!=='go')return;const m=Math.hypot(a.x||0,a.y||0,a.z||0);if(state===0&&m>13.5&&cool<=0)state=1;else if(state===1&&m<10){state=0;cool=0.16;step()}};
 [bL,bR].forEach((b,i)=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(i!==lastSide){lastSide=i;step()}}));
 motionStart(box,go,()=>{phase='go';t=0;SFX.horn();fl.textContent='SPRING!';fl.className='flash hot'},()=>{manual=true;st.hidden=false;sensorNote(box,'Ingen rörelsesensor. Tryck vänster/höger växelvis.');phase='go';t=0},'devicemotion',onM);
 const stop=sceneLoop(cv,(c,W,H,tt,dt)=>{cool-=dt;
  if(phase==='go'){t+=dt;tEl.textContent=t.toFixed(1).replace('.',',')+' s';if(t>=30&&!ended){ended=true;fl.textContent='Liften gick. Du står kvar i kön.';fl.className='flash bad';SFX.fail();setTimeout(()=>done(30000+(GOAL-n)*300),800)}}
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7fb2e6');g.addColorStop(1,'#e8f1f8');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#f4f8fb';c.fillRect(0,H*0.75,W,H*0.25);
  const prog=n/GOAL,lx=W*0.85;c.fillStyle='#8f2a1e';c.fillRect(lx-20,H*0.45,40,H*0.3);c.fillStyle='#2b3542';c.fillRect(lx-2,H*0.1,4,H*0.35);c.strokeStyle='#2b3542';c.lineWidth=2;c.beginPath();c.moveTo(0,H*0.12);c.lineTo(W,H*0.08);c.stroke();
  const chairX=((tt*40)%(W+80))-40;c.fillStyle='#3a4757';c.fillRect(chairX-20,H*0.3,40,6);c.beginPath();c.moveTo(chairX,H*0.1);c.lineTo(chairX,H*0.3);c.stroke();
  const running=phase==='go'&&t-last<0.4,ph=n*Math.PI/2;const sc=Math.min(1.2,H/190),px=W*0.1+prog*W*0.6;
  guy(c,{x:px,y:H*0.95,s:sc,col:ME,boot:'ski',bootsL:4,bootsR:4,lL:running?Math.sin(ph)*0.7:0.1,lR:running?-Math.sin(ph)*0.7:-0.1,aL:running?2.2+Math.sin(ph)*0.6:0.3,aR:running?2.4-Math.sin(ph)*0.6:0.4,lean:running?0.15:0,eyes:'wide',mouth:running?'grit':'o',flush:Math.min(0.7,n/40),
   hold:(c2,hx,hy)=>{c2.strokeStyle='#d2412d';c2.lineWidth=3;c2.beginPath();c2.moveTo(hx-10,hy+14);c2.lineTo(hx+20,hy-30);c2.stroke()}});
  guy(c,{x:lx,y:H*0.95,s:sc*0.9,col:'#ff9f43',hat:'#d2412d',flip:-1,aR:2.8,aL:0.3,mouth:'o'});
  if(phase==='go')bubble(c,lx,H*0.95-100*sc*0.9,['Sista åket!','Skynda!','Vi stänger!'][Math.floor(tt/2)%3],W);
 });
 return()=>{ended=true;window.removeEventListener('devicemotion',onM);stop()};
};

/* ================= BACKGROUND SNOW ================= */
(function(){
 if(REDUCED)return;const cv=document.getElementById('snow');
 const fl=Array.from({length:45},()=>({x:Math.random(),y:Math.random(),r:0.6+Math.random()*1.8,s:0.02+Math.random()*0.05,w:Math.random()*6}));
 let last=performance.now();
 let acc=0;function f(n){const dt0=(n-last)/1000;last=n;acc+=dt0;if(acc<1/30||(S.state&&S.state.ph==='play')||document.hidden){requestAnimationFrame(f);return}const dt=Math.min(0.1,acc);acc=0;const {ctx,W,H}=fit(cv,1);ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(238,243,247,.55)';
  const wind=1+myPr()*0.6;for(const p of fl){p.y+=p.s*dt*wind;p.w+=dt*wind;if(p.y>1.02){p.y=-0.02;p.x=Math.random()}ctx.beginPath();ctx.arc(p.x*W+Math.sin(p.w)*8*wind,p.y*H,p.r,0,7);ctx.fill()}
  requestAnimationFrame(f)}
 requestAnimationFrame(f);
})();
